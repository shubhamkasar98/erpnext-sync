; ============================================================
; LOCAL LAPTOP TEST CONFIG  (no biometric device needed)
; Copy to config.ini, fill api_key/api_secret, keep chmod 600.
; ============================================================

[erpnext]
; your local bench site. *.localhost resolves to 127.0.0.1 on Ubuntu
url = http://erp.localhost:8000
api_key =
api_secret =
; Employee field that holds the device user ID ("Attendance Device ID")
; HRMS v16 only allows: attendance_device_id | employee | name
employee_field = attendance_device_id
; must match System Settings > Time Zone of the ERP site
timezone = Asia/Kolkata
verify_ssl = false
request_timeout = 30

[sync]
; punches older than this date are ignored (set to go-live date on the server)
import_start_date = 2026-09-10
; none  = don't send IN/OUT, let Shift Type "Alternating entries" decide (recommended)
; punch = use the IN/OUT key pressed on the device
log_type_mode = none
; repeat presses by the same user within N seconds are skipped (0 = off)
min_gap_seconds = 60
; retries for unexpected ERP errors before a punch is parked as failed
max_attempts = 5
; punches with no matching Employee are retried every N hours
unmapped_retry_hours = 6
max_push_per_run = 5000
; comma separated Shift Type names whose "Last Sync of Checkin" this script manages.
; leave empty to skip. Untick "Automatically update Last Sync of Checkin" on them.
shift_types =
data_dir = data
log_dir = logs

; ---- two fake devices backed by CSV files ----
[device:main_gate]
enabled = true
driver = mock
device_id = Main Gate
mock_file = mock_data/main_gate.csv
; set to true to simulate this device being unreachable
mock_offline = false

[device:back_gate]
enabled = true
driver = mock
device_id = Back Gate
mock_file = mock_data/back_gate.csv
mock_offline = false
