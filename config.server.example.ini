; ============================================================
; SERVER CONFIG  (real ZKTeco devices)
; Copy to config.ini, fill values, keep chmod 600.
; ============================================================

[erpnext]
url = https://erp.clientdomain.com
api_key =
api_secret =
employee_field = attendance_device_id
timezone = Asia/Kolkata
verify_ssl = true
request_timeout = 30

[sync]
; go-live date: nothing older than this is pushed
import_start_date = 2026-09-15
log_type_mode = none
min_gap_seconds = 60
max_attempts = 5
unmapped_retry_hours = 6
max_push_per_run = 5000
; e.g. shift_types = General Shift, Night Shift
shift_types =
data_dir = data
log_dir = logs

[device:main_gate]
enabled = true
driver = zk
device_id = Main Gate
ip = 192.168.1.201
port = 4370
; device Comm Key (Menu > Comm > Comm Key). 0 if not set
password = 0
timeout = 30
; try true only if TCP connect fails on an older model
force_udp = false
; keep device clock in step with the server (recommended once verified)
sync_device_time = false
; lock the keypad while reading logs; re-enabled in a finally block
disable_while_reading = false

[device:back_gate]
enabled = true
driver = zk
device_id = Back Gate
ip = 192.168.1.202
port = 4370
password = 0
timeout = 30
force_udp = false
sync_device_time = false
disable_while_reading = false
